<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raze KB — CMS Dashboard</title>
    <meta name="description" content="CMS Dashboard for managing Raze KB content via GitHub. Developed by Raze Software.">
    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Marked.js for Markdown Preview -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="../assets/raze-logo.svg">
</head>
<body>

    <!-- ======== CONNECTION OVERLAY ======== -->
    <div id="login-overlay">
        <div class="login-card">
            <img src="../assets/raze-logo.svg" alt="Raze Logo" style="width: 44px; height: 44px; border-radius: 8px; margin-bottom: 12px;">
            <h2>Raze KB CMS</h2>
            <p>Connect your GitHub repository to manage content · Developed by Raze Software</p>

            <div class="input-group">
                <label>GitHub Personal Access Token</label>
                <input type="password" id="gh-token" placeholder="ghp_xxxxxxxxxxxx">
                <small><a href="https://github.com/settings/tokens/new?scopes=repo&description=RazeKB%20CMS" target="_blank">Generate a token</a> — select the <code>repo</code> scope</small>
            </div>

            <div class="input-group">
                <label>Repository Owner (Username)</label>
                <input type="text" id="gh-owner" placeholder="e.g., AbdulrahmanAbuElNaga">
            </div>

            <div class="input-group">
                <label>Repository Name</label>
                <input type="text" id="gh-repo" placeholder="e.g., OffenciveTips0">
            </div>

            <button onclick="connectGitHub()" class="btn-save" style="width: 100%; margin-top: 20px; justify-content: center;">
                <i class="fas fa-plug"></i> Connect Repository
            </button>
        </div>
    </div>

    <!-- ======== DASHBOARD ======== -->
    <div class="dashboard-container">

        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-brand">
                    <img src="../assets/raze-logo.svg" alt="Raze Logo" style="width: 22px; height: 22px; border-radius: 4px;">
                    <h2>RAZE KB CMS</h2>
                    <button class="mobile-close" onclick="toggleSidebar()"><i class="fas fa-times"></i></button>
                </div>
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="file-search" placeholder="Filter files..." oninput="filterFiles()">
                </div>
            </div>
            <div id="file-list" class="file-tree"></div>
            <div class="sidebar-footer" style="flex-direction:column;gap:6px;">
                    <button onclick="triggerBuild()" class="btn-build" style="width:100%;">
                        <i class="fas fa-sync"></i> Rebuild Site Index
                    </button>
                    <div style="display:flex;gap:4px;width:100%;">
                        <a href="/forum.html" class="btn-outline" style="flex:1;text-align:center;text-decoration:none;font-size:11px;padding:6px;">
                            <i class="fas fa-comments"></i> Forum
                        </a>
                        <a href="/news.html" class="btn-outline" style="flex:1;text-align:center;text-decoration:none;font-size:11px;padding:6px;">
                            <i class="fas fa-newspaper"></i> News
                        </a>
                        <a href="/reports.html" class="btn-outline" style="flex:1;text-align:center;text-decoration:none;font-size:11px;padding:6px;">
                            <i class="fas fa-flag"></i> Reports
                        </a>
                    </div>
                    <a href="/" class="back-to-site" style="width:100%;justify-content:center;">
                        <i class="fas fa-arrow-left"></i> Back to site
                    </a>
                    <button onclick="logout()" class="btn-logout" style="width:100%;">Disconnect &amp; Logout</button>
                </div>
        </aside>

        <!-- Main Editor -->
        <main class="editor-area">
            <div class="editor-header">
                <div class="header-left">
                    <button class="mobile-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
                    <div class="path-info">
                        <i class="far fa-file-alt" style="color: var(--text-dim); font-size: 11px; flex-shrink: 0;"></i>
                        <input type="text" id="file-path" placeholder="Select a file from the sidebar..." readonly>
                        <button onclick="renameFile()" title="Rename / Move"><i class="fas fa-edit"></i></button>
                        <button onclick="deleteFile()" title="Delete file" class="btn-danger"><i class="fas fa-trash"></i></button>
                    </div>
                </div>
                <div class="actions">
                    <span id="save-status"></span>
                    <button onclick="togglePreview()" id="preview-toggle" class="btn-outline">
                        <i class="fas fa-eye"></i> Preview
                    </button>
                    <button onclick="saveFile()" class="btn-save">
                        <i class="fas fa-save"></i> Save
                    </button>
                </div>
            </div>

            <!-- Toolbar -->
            <div class="toolbar">
                <button onclick="insertText('# ')" title="Heading 1"><i class="fas fa-heading"></i>1</button>
                <button onclick="insertText('## ')" title="Heading 2"><i class="fas fa-heading"></i>2</button>
                <button onclick="insertText('### ')" title="Heading 3"><i class="fas fa-heading"></i>3</button>
                <div class="separator"></div>
                <button onclick="insertWrap('**', '**')" title="Bold"><i class="fas fa-bold"></i></button>
                <button onclick="insertWrap('*', '*')" title="Italic"><i class="fas fa-italic"></i></button>
                <button onclick="insertWrap('~~', '~~')" title="Strikethrough"><i class="fas fa-strikethrough"></i></button>
                <button onclick="insertWrap('`', '`')" title="Inline Code"><i class="fas fa-code"></i></button>
                <div class="separator"></div>
                <button onclick="insertText('- ')" title="List item"><i class="fas fa-list"></i></button>
                <button onclick="insertText('1. ')" title="Ordered list"><i class="fas fa-list-ol"></i></button>
                <button onclick="insertWrap('```bash\n', '\n```')" title="Code block"><i class="fas fa-file-code"></i> bash</button>
                <button onclick="insertText('> ')" title="Blockquote"><i class="fas fa-quote-left"></i></button>
                <div class="separator"></div>
                <button onclick="undo()" title="Undo"><i class="fas fa-undo"></i></button>
                <button onclick="redo()" title="Redo"><i class="fas fa-redo"></i></button>
            </div>

            <!-- Editor + Preview -->
            <div class="editor-container">
                <textarea id="editor" placeholder="Select a file from the left sidebar to start editing..." oninput="updatePreview()"></textarea>
                <div id="preview" class="preview-panel hidden"></div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
